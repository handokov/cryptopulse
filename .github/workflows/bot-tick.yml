# Trading-bot heartbeat: hits /api/bot/tick every 5 minutes so enabled bots
# can act around the clock (Vercel hobby cron can't do sub-daily schedules).
#
# Secret required: BOT_TICK_SECRET (repo Actions secret + Vercel env var).
# The engine guards against overlapping ticks (4-minute min gap), so a
# delayed or overlapping run is harmless.

name: bot-tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # manual run for testing

concurrency:
  group: bot-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call bot tick endpoint
        run: |
          curl -sS -m 50 -X POST \
            -H "x-bot-secret: ${{ secrets.BOT_TICK_SECRET }}" \
            https://cryptopulse-iota-self.vercel.app/api/bot/tick \
            | tee /tmp/tick.json | head -c 2000
          grep -q '"ok":true' /tmp/tick.json
